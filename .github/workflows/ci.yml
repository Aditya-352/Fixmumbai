
name: Prisehat Pulse CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# cancels an outdated run when a newer commit arrives for the same ref.
concurrency:
  group: prisehat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_APP_URL: https://prisehat.healthrytix.com

    steps:
      - name: Check out repository  # downloads the repository source into the runner.
        uses: actions/checkout@v4

      - name: Set up Node.js    
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build  

  publish-image:
    name: Build and publish Docker image
    needs: test-and-build

    # Only publish after a successful push to main.
    # Pull requests must never publish deployment images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ghcr.io/healthrytixtech/fixmumbai:${{ github.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/healthrytixtech/Fixmumbai
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max