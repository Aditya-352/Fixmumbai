services:
  prisehat-pulse:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: prisehat-pulse

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production

    networks:
      - app_network

    expose:
      - "3000"

networks:
  app_network:  # Compose's internal/reference name
    external: true
    name: ${DOCKER_NETWORK}  # actual docker network name
