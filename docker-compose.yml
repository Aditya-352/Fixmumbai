services:
  fixmumbai:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fixmumbai

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production

    networks:
      - app_network

    expose:
      - "3000"

    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: fixmumbai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixmumbai_user
      POSTGRES_PASSWORD: fixmumbai_prod_2024
      POSTGRES_DB: fixmumbai
    volumes:
      - fixmumbai_pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixmumbai_user -d fixmumbai"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network:  # Compose's internal/reference name
    external: true
    name: ${DOCKER_NETWORK}  # actual docker network name

volumes:
  fixmumbai_pgdata:
